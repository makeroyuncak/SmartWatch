
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: white; margin: 0; }
        .nav-bar { background: #333; padding: 10px; display: flex; justify-content: center; gap: 10px; }
        button { padding: 10px 20px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; }
        iframe { width: 100%; height: calc(100vh - 60px); border: none; }
        .active { background: #27ae60; color: white; }
    </style>
</head>
<body>
    <div class="nav-bar">
        <button id="btn-color" class="active" onclick="loadPage('color')">🎨 Renk Ayarları</button>
        <button id="btn-device" onclick="loadPage('device')">⚙️ Cihaz Ayarları</button>
    </div>
    <iframe id="content-frame" src="/ledPage"></iframe>

    <script>
        function loadPage(page) {
            const frame = document.getElementById('content-frame');
            const btnColor = document.getElementById('btn-color');
            const btnDevice = document.getElementById('btn-device');

            if(page === 'color') {
                frame.src = '/ledPage';
                btnColor.classList.add('active');
                btnDevice.classList.remove('active');
            } else {
                frame.src = '/settingPage';
                btnDevice.classList.add('active');
                btnColor.classList.remove('active');
            }
        }
    </script>
</body>
</html>
