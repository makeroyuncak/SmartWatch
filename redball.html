<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bounce & Roll - Renkli Çocuk Dünyası</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Fredoka One', cursive, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            background: #1a0933;
            overflow: hidden;
            position: fixed;
        }

        #orientation-warning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #1a0933;
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        #orientation-warning .rotate-icon {
            font-size: 60px;
            animation: rotatePhone 1.5s infinite alternate ease-in-out;
            margin-bottom: 20px;
        }
        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(90deg); }
        }

        @media screen and (max-width: 768px) and (orientation: portrait) {
            #orientation-warning {
                display: flex;
            }
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #87CEEB;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff6b6b, #48dbfb);
            z-index: 20;
            transition: opacity 0.3s ease;
            padding: 20px;
        }
        .screen.hidden {
            display: none;
        }
        h1 {
            font-size: clamp(32px, 6vw, 52px);
            margin-bottom: 10px;
            color: #ffeb3b;
            text-shadow: 3px 3px 0px #ff5252, -2px -2px 0px #2196f3, 4px 4px 10px rgba(0,0,0,0.4);
            text-align: center;
            animation: bounceTitle 2s infinite alternate;
        }
        @keyframes bounceTitle {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }
        .subtitle {
            font-size: clamp(14px, 2.5vw, 20px);
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 25px;
            text-align: center;
        }
        .btn-fun {
            background: #2ed573;
            color: white;
            border: 4px solid #fff;
            padding: 12px 35px;
            font-size: clamp(16px, 2.5vw, 22px);
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0px #10ac84, 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.1s, background 0.2s, box-shadow 0.1s;
            margin: 8px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .btn-fun:hover {
            background: #26af5f;
            transform: scale(1.05);
        }
        .btn-fun:active {
            transform: scale(0.95) translateY(4px);
            box-shadow: 0 2px 0px #10ac84, 0 5px 10px rgba(0,0,0,0.3);
        }

        .difficulty-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            background: rgba(255,255,255,0.3);
            border: 3px solid #fff;
            padding: 6px 16px;
            border-radius: 20px;
            color: white;
            font-size: clamp(12px, 2vw, 15px);
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #ff4757;
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(55px, 1fr));
            gap: 10px;
            max-height: 50vh;
            overflow-y: auto;
            padding: 15px;
            width: min(85vw, 600px);
            background: rgba(0, 0, 0, 0.25);
            border: 3px dashed rgba(255,255,255,0.6);
            border-radius: 15px;
        }
        .level-btn {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #ffa502, #ff7f50);
            border: 3px solid white;
            border-radius: 14px;
            font-size: 18px;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 0px #d35400, 0 6px 10px rgba(0,0,0,0.2);
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: auto;
        }
        .level-btn:hover {
            transform: scale(1.08);
        }
        .level-btn:active {
            transform: scale(0.95) translateY(3px);
            box-shadow: 0 2px 0px #d35400;
        }
        .level-btn.locked {
            background: linear-gradient(135deg, #747d8c, #57606f);
            box-shadow: 0 5px 0px #2f3542;
            color: #ced6e0;
            cursor: not-allowed;
        }
        .level-btn.easy { border-color: #2ed573; }
        .level-btn.medium { border-color: #ffa502; }
        .level-btn.hard { border-color: #ff4757; }

        .level-stars {
            font-size: 10px;
            color: #ffeb3b;
            margin-top: 1px;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.8);
        }

        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
            font-size: clamp(14px, 2vw, 18px);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .hud-badge {
            background: rgba(0,0,0,0.4);
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.8);
            display: flex;
            gap: 15px;
            align-items: center;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 25px;
            right: 25px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            pointer-events: auto;
        }
        .ctrl-group {
            display: flex;
            gap: 15px;
        }
        .ctrl-btn {
            width: 68px;
            height: 68px;
            background: rgba(255, 255, 255, 0.35);
            border: 3px solid white;
            border-radius: 50%;
            font-size: 28px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }
        .ctrl-btn:active {
            background: rgba(255, 255, 255, 0.75);
            transform: scale(0.92);
        }
    </style>
</head>
<body>

<div id="orientation-warning">
    <div class="rotate-icon">📱🔄</div>
    <h2 style="color: #ffeb3b; margin-bottom: 10px;">Lütfen Telefonunuzu Çevirin!</h2>
    <p style="font-size: 15px; max-width: 300px; color: #ddd; line-height: 1.4;">Bu oyun tam ekran ve en iyi deneyim için **Yatay (Landscape)** modda oynanır.</p>
</div>

<div id="game-container">
    <div id="main-menu" class="screen">
        <h1>🎈 BOUNCE & ROLL 🌟</h1>
        <div class="subtitle">Eğlenceli ve Renkli Zıplama Maceraları!</div>
        <button class="btn-fun" onclick="openLevelMenu()">🚀 MACERAYA BAŞLA</button>
    </div>

    <div id="level-menu" class="screen hidden" style="background: linear-gradient(135deg, #3742fa, #2f3542);">
        <h2 style="color:#ffeb3b; margin:0 0 10px 0; font-size:clamp(22px, 4vw, 30px);">Seviyeni Seç</h2>
        
        <div class="difficulty-tabs">
            <button class="tab-btn active" onclick="filterLevels('all')">🌈 Tümü (50)</button>
            <button class="tab-btn" onclick="filterLevels('easy')">🟢 Kolay (1-15)</button>
            <button class="tab-btn" onclick="filterLevels('medium')">🟡 Orta (16-35)</button>
            <button class="tab-btn" onclick="filterLevels('hard')">🔴 Zor (36-50)</button>
        </div>

        <div class="level-grid" id="level-grid-container"></div>
        <button class="btn-fun" style="background:#ffa502; font-size:16px; padding:8px 24px; margin-top:10px;" onclick="backToMain()">🏠 Ana Menü</button>
    </div>

    <div id="popup-screen" class="screen hidden" style="background: rgba(46, 213, 115, 0.95);">
        <h2 id="popup-title" style="font-size:clamp(28px, 5vw, 40px); color:#ffeb3b; text-shadow:2px 2px 0px #000; margin-bottom: 10px;">Harika İş Çıkardın! 🎉</h2>
        <p id="popup-desc" style="font-size: clamp(18px, 3vw, 24px); margin-bottom: 20px;">⭐ Yıldızlar: ⭐⭐⭐</p>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
            <button class="btn-fun" style="background:#ff4757;" onclick="nextLevel()">Sonraki Bölüm ➡️</button>
            <button class="btn-fun" style="background:#3742fa;" onclick="openLevelMenu()">Seviyeler 🗺️</button>
        </div>
    </div>

    <div id="hud" style="display:none;">
        <div class="hud-badge">
            <span id="hud-level">Seviye: 1</span>
            <span id="hud-theme">🌲 Orman</span>
            <span id="hud-stars">⭐ 0/3</span>
        </div>
        <div>
            <button class="btn-fun" style="padding: 6px 16px; font-size: 14px; margin:0; pointer-events: auto; background:#ff4757;" onclick="openLevelMenu()">Çıkış ✖</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="mobile-controls" style="display:none;">
        <div class="ctrl-group">
            <div class="ctrl-btn" ontouchstart="keys['ArrowLeft']=true" ontouchend="keys['ArrowLeft']=false" onmousedown="keys['ArrowLeft']=true" onmouseup="keys['ArrowLeft']=false">⬅️</div>
            <div class="ctrl-btn" ontouchstart="keys['ArrowRight']=true" ontouchend="keys['ArrowRight']=false" onmousedown="keys['ArrowRight']=true" onmouseup="keys['ArrowRight']=false">➡️</div>
        </div>
        <div class="ctrl-group">
            <div class="ctrl-btn" ontouchstart="keys['ArrowUp']=true" ontouchend="keys['ArrowUp']=false" onmousedown="keys['ArrowUp']=true" onmouseup="keys['ArrowUp']=false">⬆️</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function requestFullScreen() {
        let element = document.documentElement;
        if (element.requestFullscreen) {
            element.requestFullscreen().catch(() => {});
        } else if (element.webkitRequestFullscreen) {
            element.webkitRequestFullscreen();
        } else if (element.msRequestFullscreen) {
            element.msRequestFullscreen();
        }
    }

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSound(type) {
        if (!audioCtx) return;
        try {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === "jump") {
                osc.type = "sine";
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(380, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === "star") {
                osc.type = "triangle";
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.exponentialRampToValueAtTime(900, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === "win") {
                [350, 450, 550, 700].forEach((freq, i) => {
                    let o = audioCtx.createOscillator();
                    let g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(freq, now + i * 0.1);
                    g.gain.setValueAtTime(0.2, now + i * 0.1);
                    g.gain.linearRampToValueAtTime(0.01, now + i * 0.1 + 0.15);
                    o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.15);
                });
            } else if (type === "die") {
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.25);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            }
        } catch(e) {}
    }

    let unlockedLevel = localStorage.getItem("bounce_unlocked_v4") ? parseInt(localStorage.getItem("bounce_unlocked_v4")) : 1;
    let levelStarsData = JSON.parse(localStorage.getItem("bounce_stars_v4")) || {};
    let currentLevelId = 1;
    let currentFilter = 'all';
    const totalLevels = 50;

    let player = {
        x: 50, y: 300, radius: 20,
        vx: 0, vy: 0,
        speed: 0.6, jumpForce: -11.5,
        grounded: false, angle: 0
    };

    let camera = { x: 0 };
    let keys = {};
    let currentLevelData = null;
    let gameState = "MENU";
    let particles = [];

    // 10 Farklı Detaylı Tema (Ağaç, Bulut, Çim, Araba, Mağara, Köprü, Uçurum vs.)
    const themes = {
        1: { name: "🌲 Orman & Çim", sky: "#70c5ce", platTop: "#66bb6a", platBase: "#4e342e", gravity: 0.42, deco: "forest" },
        2: { name: "☁️ Bulut Ülkesi", sky: "#b3e5fc", platTop: "#ffffff", platBase: "#b0bec5", gravity: 0.35, deco: "clouds" },
        3: { name: "🚗 Şehir Yolu", sky: "#ffeb3b", platTop: "#ff7043", platBase: "#37474f", gravity: 0.42, deco: "city" },
        4: { name: "🕳️ Mağara & Sarkıt", sky: "#263238", platTop: "#78909c", platBase: "#111111", gravity: 0.45, deco: "cave" },
        5: { name: "🌉 Köprü Geçidi", sky: "#81d4fa", platTop: "#d7ccc8", platBase: "#5d4037", gravity: 0.42, deco: "bridge" },
        6: { name: "🌋 Uçurum & Lav", sky: "#b71c1c", platTop: "#ff5722", platBase: "#311b92", gravity: 0.42, deco: "cliff" },
        7: { name: "❄️ Karlı Tepeler", sky: "#e0f7fa", platTop: "#ffffff", platBase: "#80deea", gravity: 0.4, deco: "snow" },
        8: { name: "🏭 Fabrika & Borular", sky: "#424242", platTop: "#ffa726", platBase: "#212121", gravity: 0.42, deco: "factory" },
        9: { name: "🔮 Gizemli Tapınak", sky: "#4a148c", platTop: "#ab47bc", platBase: "#311b92", gravity: 0.42, deco: "temple" },
        10: { name: "🚀 Uzay İstasyonu", sky: "#000000", platTop: "#e040fb", platBase: "#1a0033", gravity: 0.28, deco: "space" }
    };

    function getThemeForLevel(lvl) {
        let themeIndex = Math.floor((lvl - 1) / 5) + 1;
        if (themeIndex > 10) themeIndex = 10;
        return themes[themeIndex];
    }

    function generateLevelData(lvl) {
        let groundY = canvas.height - 60;
        let width = 1400 + (lvl * 35);
        let platforms = [{ x: 0, y: groundY, w: width, h: 80 }];
        let spikes = [];
        let stars = [];

        let difficulty = lvl <= 15 ? 'easy' : (lvl <= 35 ? 'medium' : 'hard');

        let platCount = 4 + Math.floor(lvl / 3);
        let step = (width - 300) / platCount;

        for (let i = 1; i <= platCount; i++) {
            let px = i * step + (Math.random() * 40 - 20);
            let py = groundY - 100 - ((i % 3) * 75) - (Math.random() * 30);
            if (py < 120) py = 120;
            let pw = Math.max(80, 180 - (lvl * 1.2));

            platforms.push({ x: px, y: py, w: pw, h: 22 });

            if (i % 2 === 0) {
                stars.push({ x: px + pw / 2, y: py - 45, collected: false });
            }

            if (difficulty === 'medium' && i % 3 === 1) {
                spikes.push({ x: px + 20, y: groundY - 18, w: Math.min(pw - 40, 80), h: 18 });
            } else if (difficulty === 'hard') {
                if (i % 2 === 1) {
                    spikes.push({ x: px + 15, y: groundY - 18, w: Math.min(pw - 30, 100), h: 18 });
                } else {
                    spikes.push({ x: px + 20, y: py - 20, w: 45, h: 18 });
                }
            }
        }

        while (stars.length < 3) {
            stars.push({ x: 300 + (stars.length * 380), y: groundY - 180, collected: false });
        }

        return {
            width: width,
            groundY: groundY,
            platforms: platforms,
            spikes: spikes,
            stars: stars.slice(0, 3),
            goal: { x: width - 100, y: groundY - 80, w: 35, h: 80 }
        };
    }

    window.addEventListener("keydown", e => { keys[e.code] = true; });
    window.addEventListener("keyup", e => { keys[e.code] = false; });

    function openLevelMenu() {
        requestFullScreen();
        initAudio();
        gameState = "LEVEL_SELECT";
        document.getElementById("main-menu").classList.add("hidden");
        document.getElementById("popup-screen").classList.add("hidden");
        document.getElementById("level-menu").classList.remove("hidden");
        document.getElementById("hud").style.display = "none";
        document.getElementById("mobile-controls").style.display = "none";
        buildLevelGrid();
    }

    function backToMain() {
        gameState = "MENU";
        document.getElementById("level-menu").classList.add("hidden");
        document.getElementById("main-menu").classList.remove("hidden");
        document.getElementById("hud").style.display = "none";
        document.getElementById("mobile-controls").style.display = "none";
    }

    function filterLevels(type) {
        currentFilter = type;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        buildLevelGrid();
    }

    function buildLevelGrid() {
        const gridContainer = document.getElementById("level-grid-container");
        gridContainer.innerHTML = "";

        for (let i = 1; i <= totalLevels; i++) {
            if (currentFilter === 'easy' && (i < 1 || i > 15)) continue;
            if (currentFilter === 'medium' && (i < 16 || i > 35)) continue;
            if (currentFilter === 'hard' && (i < 36 || i > 50)) continue;

            const btn = document.createElement("button");
            btn.className = "level-btn";
            
            let diffClass = i <= 15 ? 'easy' : (i <= 35 ? 'medium' : 'hard');
            btn.classList.add(diffClass);

            let isLocked = i > unlockedLevel;
            if (isLocked) {
                btn.classList.add("locked");
                btn.innerHTML = `${i} 🔒`;
            } else {
                let starsCount = levelStarsData[i] || 0;
                let starStr = "⭐".repeat(starsCount) + "☆".repeat(3 - starsCount);
                btn.innerHTML = `${i}<span class="level-stars">${starStr}</span>`;
                btn.onclick = () => startLevel(i);
            }
            gridContainer.appendChild(btn);
        }
    }

    function startLevel(levelId) {
        requestFullScreen();
        resizeCanvas();
        initAudio();
        currentLevelId = levelId;
        currentLevelData = generateLevelData(levelId);
        
        player.x = 60;
        player.y = currentLevelData.groundY - 50;
        player.vx = 0;
        player.vy = 0;
        player.grounded = false;
        particles = [];

        gameState = "PLAYING";
        document.getElementById("level-menu").classList.add("hidden");
        document.getElementById("main-menu").classList.add("hidden");
        document.getElementById("popup-screen").classList.add("hidden");
        document.getElementById("hud").style.display = "flex";
        document.getElementById("mobile-controls").style.display = "flex";

        updateHUD();
    }

    function updateHUD() {
        let theme = getThemeForLevel(currentLevelId);
        document.getElementById("hud-level").innerText = `Seviye: ${currentLevelId}`;
        document.getElementById("hud-theme").innerText = theme.name;
        let collectedCount = currentLevelData.stars.filter(s => s.collected).length;
        document.getElementById("hud-stars").innerText = `⭐ ${collectedCount}/3`;
    }

    function spawnConfetti() {
        for (let i = 0; i < 80; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 2,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.7) * 10,
                color: ['#ffeb3b', '#ff5722', '#4caf50', '#03a9f4', '#e91e63'][Math.floor(Math.random() * 5)],
                size: Math.random() * 9 + 4,
                life: 110
            });
        }
    }

    function winLevel() {
        gameState = "WIN";
        playSound("win");
        spawnConfetti();

        let collectedCount = currentLevelData.stars.filter(s => s.collected).length;
        if (!levelStarsData[currentLevelId] || collectedCount > levelStarsData[currentLevelId]) {
            levelStarsData[currentLevelId] = collectedCount;
            localStorage.setItem("bounce_stars_v4", JSON.stringify(levelStarsData));
        }

        if (currentLevelId >= unlockedLevel && currentLevelId < totalLevels) {
            unlockedLevel = currentLevelId + 1;
            localStorage.setItem("bounce_unlocked_v4", unlockedLevel);
        }

        document.getElementById("popup-title").innerText = "Bölüm Geçildi! 🎉";
        document.getElementById("popup-desc").innerText = `Kazanılan Yıldızlar: ${"⭐".repeat(collectedCount)}${"☆".repeat(3 - collectedCount)}`;
        document.getElementById("popup-screen").classList.remove("hidden");
        document.getElementById("mobile-controls").style.display = "none";
    }

    function nextLevel() {
        if (currentLevelId < totalLevels) {
            startLevel(currentLevelId + 1);
        } else {
            openLevelMenu();
        }
    }

    function gameOver() {
        playSound("die");
        startLevel(currentLevelId);
    }

    function update() {
        let theme = getThemeForLevel(currentLevelId);

        if (gameState === "WIN") {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.25;
                p.life--;
            });
            return;
        }

        if (gameState !== "PLAYING") return;

        if (keys["ArrowLeft"] || keys["KeyA"]) {
            player.vx -= player.speed;
            player.angle -= 0.1;
        }
        if (keys["ArrowRight"] || keys["KeyD"]) {
            player.vx += player.speed;
            player.angle += 0.1;
        }
        if ((keys["ArrowUp"] || keys["KeyW"] || keys["Space"]) && player.grounded) {
            player.vy = player.jumpForce;
            player.grounded = false;
            playSound("jump");
        }

        player.vx *= 0.92;
        player.vy += theme.gravity;

        player.x += player.vx;
        player.y += player.vy;
        player.grounded = false;

        currentLevelData.platforms.forEach(plat => {
            if (player.x + player.radius > plat.x && 
                player.x - player.radius < plat.x + plat.w &&
                player.y + player.radius >= plat.y && 
                player.y - player.radius < plat.y + plat.h) {
                if (player.vy > 0 && player.y - player.vy + player.radius <= plat.y) {
                    player.y = plat.y - player.radius;
                    player.vy = 0;
                    player.grounded = true;
                }
            }
        });

        if (player.x - player.radius < 0) { player.x = player.radius; player.vx = 0; }
        if (player.x + player.radius > currentLevelData.width) { player.x = currentLevelData.width - player.radius; player.vx = 0; }
        if (player.y > canvas.height + 60) { gameOver(); }

        currentLevelData.spikes.forEach(spike => {
            if (player.x + player.radius > spike.x && 
                player.x - player.radius < spike.x + spike.w &&
                player.y + player.radius > spike.y && 
                player.y - player.radius < spike.y + spike.h) {
                gameOver();
            }
        });

        currentLevelData.stars.forEach(star => {
            if (!star.collected) {
                let dist = Math.hypot(player.x - star.x, player.y - star.y);
                if (dist < player.radius + 14) {
                    star.collected = true;
                    playSound("star");
                    updateHUD();
                }
            }
        });

        let goal = currentLevelData.goal;
        if (player.x + player.radius > goal.x && 
            player.x - player.radius < goal.x + goal.w &&
            player.y + player.radius > goal.y && 
            player.y - player.radius < goal.y + goal.h) {
            winLevel();
        }

        camera.x = player.x - canvas.width / 2;
        if (camera.x < 0) camera.x = 0;
        if (camera.x > currentLevelData.width - canvas.width) {
            camera.x = currentLevelData.width - canvas.width;
        }
    }

    // ARKA PLAN TEMA ÇİZİM FONKSİYONLARI (Ağaç, Bulut, Araba, Mağara, Köprü, Uçurum vb.)
    function drawBackgroundDecorations(theme, width, groundY) {
        ctx.save();
        let parallax = camera.x * 0.4; // Paralaks efektli derinlik

        if (theme.deco === "forest") {
            // Ağaçlar ve Çimler
            for (let i = 100; i < width; i += 250) {
                let xPos = (i - parallax) % (width + 300) - 150;
                // Ağaç Gövdesi
                ctx.fillStyle = "#3e2723";
                ctx.fillRect(xPos + 40, groundY - 140, 20, 140);
                // Ağaç Yaprakları
                ctx.fillStyle = "#2e7d32";
                ctx.beginPath();
                ctx.arc(xPos + 50, groundY - 150, 50, 0, Math.PI * 2);
                ctx.fill();
            }
        } else if (theme.deco === "clouds") {
            // Büyük Bulutlar
            for (let i = 50; i < width; i += 300) {
                let xPos = (i - parallax * 0.7) % (width + 400) - 200;
                ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
                ctx.beginPath();
                ctx.arc(xPos, 120, 35, 0, Math.PI * 2);
                ctx.arc(xPos + 30, 100, 45, 0, Math.PI * 2);
                ctx.arc(xPos + 70, 120, 35, 0, Math.PI * 2);
                ctx.fill();
            }
        } else if (theme.deco === "city") {
            // Araba ve Şehir Binaları
            for (let i = 80; i < width; i += 400) {
                let xPos = (i - parallax) % (width + 400) - 200;
                // Bina silüeti
                ctx.fillStyle = "#263238";
                ctx.fillRect(xPos, groundY - 220, 90, 220);
                // Işıklar
                ctx.fillStyle = "#ffeb3b";
                ctx.fillRect(xPos + 15, groundY - 190, 15, 20);
                ctx.fillRect(xPos + 55, groundY - 190, 15, 20);
                ctx.fillRect(xPos + 15, groundY - 140, 15, 20);
            }
            // Yolda Hareket Eden Araba
            let carX = (Date.now() * 0.15) % (width + 200) - 100;
            ctx.fillStyle = "#e91e63";
            ctx.fillRect(carX, groundY - 35, 60, 25);
            ctx.fillStyle = "#333";
            ctx.beginPath();
            ctx.arc(carX + 15, groundY - 10, 8, 0, Math.PI * 2);
            ctx.arc(carX + 45, groundY - 10, 8, 0, Math.PI * 2);
            ctx.fill();
        } else if (theme.deco === "cave") {
            // Mağara Sarkıtları
            for (let i = 50; i < width; i += 180) {
                let xPos = (i - parallax) % (width + 200) - 100;
                ctx.fillStyle = "#455a64";
                ctx.beginPath();
                ctx.moveTo(xPos, 0);
                ctx.lineTo(xPos + 30, 0);
                ctx.lineTo(xPos + 15, 90 + (i % 40));
                ctx.closePath();
                ctx.fill();
            }
        } else if (theme.deco === "bridge") {
            // Asma Köprü Halatları ve Destekleri
            for (let i = 200; i < width; i += 500) {
                let xPos = (i - parallax) % (width + 500) - 250;
                ctx.fillStyle = "#3e2723";
                ctx.fillRect(xPos, groundY - 180, 25, 180);
                ctx.strokeStyle = "#8d6e63";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(xPos, groundY - 160);
                ctx.quadraticCurveTo(xPos + 125, groundY - 80, xPos + 250, groundY - 160);
                ctx.stroke();
            }
        } else if (theme.deco === "cliff") {
            // Derin Uçurum Çukurları ve Duman/Lav Efektleri
            for (let i = 300; i < width; i += 600) {
                let xPos = (i - parallax) % (width + 600) - 300;
                ctx.fillStyle = "#d32f2f";
                ctx.fillRect(xPos, groundY + 10, 180, 40); // Lav birikintisi
            }
        } else if (theme.deco === "snow") {
            // Karlı Dağlar ve Yağan Kar Taneleri
            ctx.fillStyle = "rgba(255,255,255,0.8)";
            for (let i = 0; i < 40; i++) {
                let sx = (i * 135 - camera.x * 0.2) % width;
                let sy = (i * 75 + Date.now() * 0.05) % canvas.height;
                ctx.beginPath();
                ctx.arc(sx, sy, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        } else if (theme.deco === "factory") {
            // Borular ve Duman Bacaları
            for (let i = 150; i < width; i += 400) {
                let xPos = (i - parallax) % (width + 400) - 200;
                ctx.fillStyle = "#546e7a";
                ctx.fillRect(xPos, groundY - 160, 40, 160);
                ctx.fillStyle = "#ffb74d";
                ctx.fillRect(xPos - 5, groundY - 180, 50, 20);
            }
        } else if (theme.deco === "temple") {
            // Sütunlar ve Tapınak Kalıntıları
            for (let i = 120; i < width; i += 350) {
                let xPos = (i - parallax) % (width + 350) - 170;
                ctx.fillStyle = "#7b1fa2";
                ctx.fillRect(xPos, groundY - 200, 30, 200);
            }
        } else if (theme.deco === "space") {
            // Yıldızlar ve Gezegen
            ctx.fillStyle = "#ffeb3b";
            for (let i = 0; i < 50; i++) {
                let sx = (i * 90 - camera.x * 0.1) % width;
                let sy = (i * 45) % (canvas.height / 2);
                ctx.fillRect(sx, sy, 2, 2);
            }
            ctx.fillStyle = "#9c27b0";
            ctx.beginPath();
            ctx.arc(width - 300, 120, 50, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (gameState !== "PLAYING" && gameState !== "WIN") return;

        let theme = getThemeForLevel(currentLevelId);

        ctx.save();
        ctx.translate(-camera.x, 0);

        // Gökyüzü
        ctx.fillStyle = theme.sky;
        ctx.fillRect(0, 0, currentLevelData.width, canvas.height);

        // Bölüme Özel Arka Plan Unsurları (Ağaç, Bulut, Araba, Mağara, Köprü, Uçurum vb.)
        drawBackgroundDecorations(theme, currentLevelData.width, currentLevelData.groundY);

        // Platformlar
        currentLevelData.platforms.forEach(plat => {
            ctx.fillStyle = theme.platBase;
            ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctx.fillStyle = theme.platTop;
            ctx.fillRect(plat.x, plat.y, plat.w, 7);
        });

        // Dikenler
        currentLevelData.spikes.forEach(spike => {
            ctx.fillStyle = "#e53935";
            let spikeWidth = 16;
            let count = Math.floor(spike.w / spikeWidth);
            for (let i = 0; i < count; i++) {
                ctx.beginPath();
                ctx.moveTo(spike.x + (i * spikeWidth), spike.y + spike.h);
                ctx.lineTo(spike.x + (i * spikeWidth) + (spikeWidth / 2), spike.y);
                ctx.lineTo(spike.x + ((i + 1) * spikeWidth), spike.y + spike.h);
                ctx.closePath();
                ctx.fill();
            }
        });

        // Yıldızlar
        currentLevelData.stars.forEach(star => {
            if (!star.collected) {
                ctx.fillStyle = "#ffd700";
                ctx.beginPath();
                ctx.arc(star.x, star.y, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#ff8f00";
                ctx.lineWidth = 2.5;
                ctx.stroke();
            }
        });

        // Bölüm Sonu Hedefi (Bayrak/Kapı)
        let goal = currentLevelData.goal;
        ctx.fillStyle = "#333";
        ctx.fillRect(goal.x + 12, goal.y, 7, goal.h);
        ctx.fillStyle = "#ff5722";
        ctx.beginPath();
        ctx.moveTo(goal.x + 19, goal.y);
        ctx.lineTo(goal.x + 38, goal.y + 18);
        ctx.lineTo(goal.x + 19, goal.y + 36);
        ctx.closePath();
        ctx.fill();

        // Oyuncu Topu
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.angle);

        let gradient = ctx.createRadialGradient(-6, -6, 2, 0, 0, player.radius);
        gradient.addColorStop(0, "#ff5252");
        gradient.addColorStop(1, "#c62828");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#8e0000";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(5, -5, 5.5, 0, Math.PI * 2);
        ctx.arc(12, -2, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "black";
        ctx.beginPath();
        ctx.arc(6, -5, 2.2, 0, Math.PI * 2);
        ctx.arc(13, -2, 1.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // Parçacıklar
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });

        ctx.restore();
    }

    function mainLoop() {
        update();
        draw();
        requestAnimationFrame(mainLoop);
    }

    mainLoop();
</script>
